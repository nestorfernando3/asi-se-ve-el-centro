  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e06957'/%3E%3C/svg%3E">
  <!-- Three.js se descarga desde ya, pero se ejecuta al final: la página pinta antes. -->
  <link rel="preload" href="assets/vendor/three.min.js" as="script">
  <link rel="prefetch" href="atlas-relativo.html">
  <link rel="prefetch" href="assets/vendor/d3.min.js">
  <link rel="prefetch" href="assets/atlas/atlas.js">
  <script>
    // Antes del primer estilo: si volvemos del atlas, la interfaz nace oculta.
    try {
      var m = JSON.parse(sessionStorage.getItem('atlas-morph') || 'null');
      if (m && m.dir === 'to-globe' && Date.now() - m.at < 4000 && !matchMedia('(prefers-reduced-motion: reduce)').matches)
        document.documentElement.classList.add('is-arriving');
      // De vuelta del atlas, el primer cuadro debe traer ya el globo: se retiene el
      // pintado hasta que el script del globo haya corrido (sin esto, un destello vacío).
      if (document.documentElement.classList.contains('is-arriving'))
      {
        var x = document.createElement('link');
        x.rel = 'expect'; x.href = '#globe-ready'; x.setAttribute('blocking', 'render');
        document.head.appendChild(x);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/globe/globe.css">
</head>
<body>
  <main data-od-id="stage">
    <header class="site-bar is-overlay">
      <a class="brand" href="index.html">Así se ve el centro<em>.</em></a>
      <nav class="site-nav" aria-label="Vistas del atlas">
        <a href="index.html" aria-current="page">Globo</a>
        <a href="atlas-relativo.html">Atlas relativo</a>
        <a href="sobre.html">Proyecto</a>
      </nav>
      <span class="site-context">Barranquilla / ciudad origen</span>
    </header>

    <section class="stage" aria-label="Mapa transmedia con video por ciudad">
      <div class="atlas" data-od-id="map-atlas">
        <div id="globe-container" aria-label="Globo terráqueo interactivo"></div>

        <div class="field-note" aria-live="polite">
          <div class="note-kicker">Ciudad seleccionada</div>
          <div class="note-title" data-note-title>Barranquilla</div>
          <div class="note-distance" data-note-distance></div>
          <div class="note-copy" data-note-copy></div>
          <div class="note-author" data-note-author></div>
        </div>

        <div class="pin-layer" aria-label="Ciudades">
        </div>
        <div class="pin-menu" role="menu" hidden></div>

        <h1 class="headline" data-od-id="headline">
          <span class="line">Así se ve</span>
          <span class="line">el centro<em>.</em></span>
        </h1>
        <div class="legend globe-legend" aria-hidden="true">
          <span><i class="dot is-live"></i>viva</span>
          <span><i class="dot is-next"></i>próxima</span>
          <span><i class="dot is-future"></i>futura</span>
        </div>
      </div>

      <aside class="viewer has-videos" data-od-id="video-hover-panel" aria-label="Video de ciudad seleccionada">
        <div class="viewer-header">
          <span class="viewer-kicker">Visor de ciudad</span>
          <strong class="viewer-city" data-active-city-label>Barranquilla</strong>
        </div>
        <div class="viewer-frame">
          <div class="video-slot vframe"></div>
          <div class="slate">
            <div class="poster-art" aria-hidden="true"></div>
            <div class="slate-title">Barranquilla abre el mapa.</div>
            <div class="slate-meta"></div>
          </div>
        </div>
        <div class="reel-switch" role="group" aria-label="Elegir pieza">
        </div>
        <div class="vcredit" data-viewer-credit hidden></div>
        <blockquote class="city-quote viewer-quote" data-viewer-quote></blockquote>
        <div class="kicker" data-rail-title></div>
        <nav class="dist-list" aria-label="Ciudades por distancia"></nav>
      </aside>
    </section>

    <footer class="site-foot is-overlay">
      <span>Gira el globo · elige una ciudad · reproduce su pieza</span>
      <span class="rule" aria-hidden="true"></span>
    </footer>
  </main>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/topojson-client.min.js"></script>
  <script src="assets/globe/land-110m.js"></script>
  <script src="assets/atlas/geo.js"></script>
  <script src="assets/atlas/cities.js"></script>
  <script src="assets/atlas/shared.js"></script>
  <script src="assets/atlas/video.js"></script>
  <script src="assets/globe/globe.js"></script>
  <span id="globe-ready" hidden></span>
</body>
</html>
