name: Deploy GitHub Pages

# The repository's github-pages environment explicitly allows atlas-relativo.
on:
  push:
    branches: [atlas-relativo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Solo se publica la lista blanca de scripts/build-site.sh, nunca la raíz:
      # el repositorio guarda material que no es para el público.
      - name: Build public site
        run: sh scripts/build-site.sh _site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
